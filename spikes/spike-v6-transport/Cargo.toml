[package]
name = "spike-v6-transport"
version = "0.0.0"
edition = "2021"
publish = false

# V6 전송 계층 실험. V8 인증·V9 캐시 수명·V10 세션 복구 경계를 포함한다.
[workspace]

[dependencies]
spike-v4-worker = { path = "../spike-v4-worker" }
spike-v1-fixture = { path = "../spike-v1-fixture" }
spike-v2-read = { path = "../spike-v2-read" }
spike-v3-write = { path = "../spike-v3-write" }
spike-v5-sdk = { path = "../spike-v5-sdk" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-postgres = "0.7.18"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
getrandom = "0.2.17"
url = "2"
