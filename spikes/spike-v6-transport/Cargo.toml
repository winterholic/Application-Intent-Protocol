[package]
name = "spike-v6-transport"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# V6 전송 계층 실험. V8 인증·V9 캐시 수명·V10 세션 복구 경계를 포함한다.
[workspace]

[features]
default = []
external-brokers = ["aip-execution/external-brokers"]

[dependencies]
aip-crypto = { path = "../../crates/aip-crypto" }
aip-execution = { path = "../../crates/aip-execution" }
serde = { version = "1", features = ["derive"] }
spike-v4-worker = { path = "../spike-v4-worker" }
spike-v1-fixture = { path = "../spike-v1-fixture" }
spike-v2-read = { path = "../spike-v2-read" }
spike-v3-write = { path = "../spike-v3-write" }
spike-v5-sdk = { path = "../spike-v5-sdk" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-postgres = "0.7.18"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
getrandom = "0.2.17"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
chrono-tz = "0.10"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
aip-migrate = { path = "../../crates/aip-migrate" }
aip-test-support = { path = "../../crates/aip-test-support", features = ["strict-db"] }
aip-test-fault-proxy = { path = "../../crates/aip-test-fault-proxy" }

# 전체 DWARF 대신 줄 정보만 남겨 target 용량을 줄인다.
[profile.dev]
debug = "line-tables-only"
