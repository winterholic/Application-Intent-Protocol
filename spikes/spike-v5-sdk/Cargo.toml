[package]
name = "spike-v5-sdk"
version = "0.0.0"
edition = "2021"
publish = false

# V5 SDK 실험. V1 facts에서 TS 계약 타입을 만들고 tsc로 화면 요청의 타입 추론·거부를 검증한다.
[workspace]

[dependencies]
spike-v1-fixture = { path = "../spike-v1-fixture" }
serde_json = "1.0.151"
sha2 = "0.10.9"
spike-v2-read = { path = "../spike-v2-read" }
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tokio-postgres = "0.7.18"
