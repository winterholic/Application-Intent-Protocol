[package]
name = "spike-v3-write"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# V3 표준 쓰기 실험. V1 facts + V2 정책 SQL 생성기를 재사용한다. 셀 봉인 경계는 aip-execution이 소유한다.
[workspace]

[dependencies]
aip-execution = { path = "../../crates/aip-execution" }
spike-v1-fixture = { path = "../spike-v1-fixture" }
spike-v2-read = { path = "../spike-v2-read" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"

[dev-dependencies]
aip-crypto = { path = "../../crates/aip-crypto" }
aip-test-support = { path = "../../crates/aip-test-support", features = ["strict-db"] }
aip-test-fault-proxy = { path = "../../crates/aip-test-fault-proxy" }

# 전체 DWARF 대신 줄 정보만 남겨 target 용량을 줄인다.
[profile.dev]
debug = "line-tables-only"
