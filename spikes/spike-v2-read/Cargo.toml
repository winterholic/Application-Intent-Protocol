[package]
name = "spike-v2-read"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# V2 호출자 읽기 수직 slice. 입력은 V1 typed facts뿐이다. 본 crates/에 의존하지 않는다.
[workspace]

[dependencies]
aip-execution = { path = "../../crates/aip-execution" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
spike-v1-fixture = { path = "../spike-v1-fixture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.4"
# 테스트 DB 안전장치는 test-db feature에서만 링크한다. 제품(release) 그래프에는 aip-test-support가 들어가지 않는다.
aip-test-support = { path = "../../crates/aip-test-support", optional = true }

[features]
default = []
test-db = ["dep:aip-test-support"]

[dev-dependencies]
aip-test-support = { path = "../../crates/aip-test-support", features = ["strict-db"] }
# 이 crate의 통합 시험이 test-db helper를 쓴다.
spike-v2-read = { path = ".", features = ["test-db"] }

# 전체 DWARF 대신 줄 정보만 남겨 target 용량을 줄인다.
[profile.dev]
debug = "line-tables-only"
