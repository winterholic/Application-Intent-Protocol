[package]
name = "aip-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aip-auth = { path = "../aip-auth" }
aip-migrate = { path = "../aip-migrate" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = "0.7"
spike-v1-fixture = { path = "../../spikes/spike-v1-fixture" }
spike-v2-read = { path = "../../spikes/spike-v2-read" }
spike-v5-sdk = { path = "../../spikes/spike-v5-sdk" }
spike-v6-transport = { path = "../../spikes/spike-v6-transport" }
spike-v11-dev-checks = { path = "../../spikes/spike-v11-dev-checks" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
