[package]
publish = false
name = "aip-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
external-brokers = ["aip-execution/external-brokers", "spike-v6-transport/external-brokers"]
mysql = ["aip-execution/mysql", "aip-migrate/mysql"]

[dependencies]
aip-auth = { path = "../aip-auth" }
aip-execution = { path = "../aip-execution" }
aip-migrate = { path = "../aip-migrate" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tokio-postgres = "0.7"
url = "2"
base64 = "0.22.1"
spike-v1-fixture = { path = "../../spikes/spike-v1-fixture" }
spike-v2-read = { path = "../../spikes/spike-v2-read" }
spike-v4-worker = { path = "../../spikes/spike-v4-worker" }
spike-v5-sdk = { path = "../../spikes/spike-v5-sdk" }
spike-v6-transport = { path = "../../spikes/spike-v6-transport" }
spike-v11-dev-checks = { path = "../../spikes/spike-v11-dev-checks" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
aip-test-support = { path = "../aip-test-support", features = ["strict-db"] }
