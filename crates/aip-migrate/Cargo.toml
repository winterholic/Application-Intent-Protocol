[package]
publish = false
name = "aip-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mysql = ["aip-execution/mysql", "dep:mysql_async", "dep:spike-v3-write", "dep:uuid"]

[dependencies]
aip-execution = { path = "../aip-execution", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring"], optional = true }
spike-v2-read = { path = "../../spikes/spike-v2-read" }
spike-v3-write = { path = "../../spikes/spike-v3-write", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
spike-v1-fixture = { path = "../../spikes/spike-v1-fixture" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
aip-execution = { path = "../aip-execution" }
aip-test-support = { path = "../aip-test-support", features = ["strict-db"] }
