name: Linux cgroup v2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgroup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegated-cgroup-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux sandbox and Rust tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap python3
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          systemd-run --version

      - name: Configure scoped Bubblewrap user namespace profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) == 1 ]]; then
            sandbox_bin="$RUNNER_TEMP/aip-ci-bwrap"
            sudo mkdir -p "$sandbox_bin"
            sudo cp "$(command -v bwrap)" "$sandbox_bin/bwrap"
            sudo tee /etc/apparmor.d/aip-ci-bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile aip-ci-bwrap "$sandbox_bin/bwrap" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/aip-ci-bwrap
            echo "$sandbox_bin" >> "$GITHUB_PATH"
          fi

      - name: Verify Bubblewrap filesystem and network isolation
        run: AIP_TEST_BWRAP=1 cargo test --manifest-path spikes/spike-v4-worker/Cargo.toml --lib isolation::tests --locked --target-dir target

      - name: Verify cgroup v2 resource limits in delegated systemd scope
        shell: bash
        run: |
          set -euo pipefail
          cargo_bin="$(command -v cargo)"
          sudo env \
            PATH="$PATH" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            AIP_CARGO_BIN="$cargo_bin" \
            bash spikes/spike-v4-worker/tests/cgroup-v2-ci.sh
