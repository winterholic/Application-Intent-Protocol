name: Storage list-scan independent verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-list-scan-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pg-minio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build pinned TLS MinIO tools
        run: |
          go install github.com/minio/minio@RELEASE.2025-09-06T17-38-46Z
          go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run PostgreSQL object ledger integration tests
        run: cargo test -p aip-execution --test object_ledger --locked -- --nocapture
      - name: Run TLS MinIO contracts and independent PG-MinIO scan probe
        run: scripts/test-minio-object-storage.sh
