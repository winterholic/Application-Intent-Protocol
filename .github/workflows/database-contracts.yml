name: Database contracts

on:
  push:
    branches: [main]
    paths:
      - 'crates/aip-test-support/**'
      - 'crates/aip-cli/**'
      - 'crates/aip-service/**'
      - 'crates/aip-migrate/**'
      - 'spikes/spike-v2-read/src/**'
      - 'spikes/spike-v3-write/src/**'
      - 'spikes/spike-v6-transport/src/**'
      - '.github/workflows/database-contracts.yml'
  workflow_dispatch:
    inputs:
      service_semantics_only:
        description: Run only the isolated PostgreSQL service data semantics matrix
        required: false
        type: boolean
        default: false
      bounded_retry_only:
        description: Run only the isolated PostgreSQL bounded owned-transaction retry regressions
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-runtime-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Disposable CI fixture credentials only. A wrong-password control proves trust auth is disabled.
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=55473 dbname=aip_test_ci user=runner password=ci_fixture_admin
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=55473 dbname=postgres user=runner password=ci_fixture_admin
      AIP_TEST_REQUIRE_PASSWORD_AUTH: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_PASSWORD: ci_fixture_admin
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - '127.0.0.1:55473:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d aip_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Configure PostgreSQL server error diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_error_verbosity = 'verbose'" \
            -c "ALTER SYSTEM SET log_lock_waits = 'on'" \
            -c "SELECT pg_reload_conf()" 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/postgres-diagnostics.log"
          diagnostic_status=${PIPESTATUS[0]}
          echo "postgres diagnostics exit=$diagnostic_status"
          exit "$diagnostic_status"
      - name: Verify credential replacement and documented runtime grants under SCRAM
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.service_semantics_only != true && inputs.bounded_retry_only != true) }}
        run: |
          cargo test -p aip-test-support --locked
          cargo test -p aip-cli --test least_privilege --locked -- --nocapture
      - name: Audit C aip-cli baseline on isolated PostgreSQL
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.service_semantics_only == true || inputs.bounded_retry_only == true)) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/aip-cli-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test -p aip-cli --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/aip-cli.log"
          test_status=${PIPESTATUS[0]}
          echo "aip-cli baseline exit=$test_status"
          exit "$test_status"
      - name: Audit C service data semantics over HTTP and database state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.service_semantics_only == true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/service-data-semantics-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test -p aip-cli --test service_flow --locked service_data_semantics_hold_across_http_and_database_state -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/service-data-semantics.log"
          test_status=${PIPESTATUS[0]}
          echo "service data semantics exit=$test_status"
          exit "$test_status"
      - name: Audit C spike-v2-read security_authorization
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.service_semantics_only == true || inputs.bounded_retry_only == true)) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/security-authorization-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v2-read/Cargo.toml --locked --test security_authorization --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/security-authorization.log"
          test_status=${PIPESTATUS[0]}
          echo "security_authorization exit=$test_status"
          exit "$test_status"
      - name: Audit C spike-v2-read negated_policy
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.service_semantics_only == true || inputs.bounded_retry_only == true)) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/negated-policy-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v2-read/Cargo.toml --locked --test negated_policy --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/negated-policy.log"
          test_status=${PIPESTATUS[0]}
          echo "negated_policy exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v3-write audit_bd_lock_order
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true || inputs.service_semantics_only != true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/audit-bd-lock-order-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v3-write/Cargo.toml --locked --target-dir target --test audit_bd_lock_order opposite_order_bundles_retry_deadlocks_then_return_one_business_refusal -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/audit-bd-lock-order.log"
          test_status=${PIPESTATUS[0]}
          echo "audit_bd_lock_order exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v6-transport audit_bd_idem_race
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.service_semantics_only == true || inputs.bounded_retry_only == true)) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/audit-bd-idem-race-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test audit_bd_idem_race -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/audit-bd-idem-race.log"
          test_status=${PIPESTATUS[0]}
          echo "audit_bd_idem_race exit=$test_status"
          exit "$test_status"
      - name: Audit baseline spike-v3-write latest_effect_values
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true || inputs.service_semantics_only != true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/latest-effect-values-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v3-write/Cargo.toml --locked --target-dir target --test latest_effect_values -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/latest-effect-values.log"
          test_status=${PIPESTATUS[0]}
          echo "latest_effect_values exit=$test_status"
          exit "$test_status"
      - name: Audit baseline spike-v3-write latest_nullable_projection
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.service_semantics_only == true || inputs.bounded_retry_only == true)) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/latest-nullable-projection-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v3-write/Cargo.toml --locked --target-dir target --test latest_nullable_projection -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/latest-nullable-projection.log"
          test_status=${PIPESTATUS[0]}
          echo "latest_nullable_projection exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v6-transport bundle_http
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/bundle-http-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test bundle_http -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/bundle-http.log"
          test_status=${PIPESTATUS[0]}
          echo "bundle_http exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v6-transport absence_serializable_http
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/absence-serializable-http-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test absence_serializable_http -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/absence-serializable-http.log"
          test_status=${PIPESTATUS[0]}
          echo "absence_serializable_http exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v6-transport write_extension_atomic
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/write-extension-atomic-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test write_extension_atomic -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/write-extension-atomic.log"
          test_status=${PIPESTATUS[0]}
          echo "write_extension_atomic exit=$test_status"
          exit "$test_status"
      - name: Audit B+D spike-v6-transport commit_unknown_wire
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.bounded_retry_only == true) }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          psql -X "$AIP_TEST_DATABASE_URL" -Atc 'SELECT 1' 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/commit-unknown-wire-readiness.log"
          readiness_status=${PIPESTATUS[0]}
          if (( readiness_status != 0 )); then exit "$readiness_status"; fi
          cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test commit_unknown_wire -- --nocapture 2>&1 | tee "$RUNNER_TEMP/aip-policy-c/commit-unknown-wire.log"
          test_status=${PIPESTATUS[0]}
          echo "commit_unknown_wire exit=$test_status"
          exit "$test_status"
      - name: Collect PostgreSQL server error logs
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/aip-policy-c"
          : > "$RUNNER_TEMP/aip-policy-c/postgres-server.log"
          mapfile -t containers < <(docker ps -a --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:17(@|$)/ {print $1}')
          if ((${#containers[@]} == 0)); then
            echo 'No PostgreSQL 17 service container found on the runner.' | tee "$RUNNER_TEMP/aip-policy-c/postgres-server.log"
            exit 0
          fi
          status=0
          for container in "${containers[@]}"; do
            echo "===== postgres container $container =====" >> "$RUNNER_TEMP/aip-policy-c/postgres-server.log"
            docker logs --timestamps "$container" >> "$RUNNER_TEMP/aip-policy-c/postgres-server.log" 2>&1 || status=$?
          done
          echo "postgres log collection exit=$status"
          exit "$status"
      - name: Preserve policy C test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-c-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aip-policy-c
          if-no-files-found: warn
          retention-days: 7

  mysql-and-mariadb-fences:
    if: ${{ github.ref != 'refs/heads/audit/semantic-c-policy-20261116' && !(github.event_name == 'workflow_dispatch' && inputs.service_semantics_only == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=55473 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=55473 dbname=postgres user=runner
      AIP_TEST_MYSQL_URL: mysql://root:ci_fixture_admin@127.0.0.1:34391/aip_test_admin
      AIP_TEST_MARIADB_URL: mariadb://root:ci_fixture_admin@127.0.0.1:34392/aip_test_admin
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_fixture_admin
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: aip_test_admin
        ports:
          - '127.0.0.1:34391:3306'
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pci_fixture_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_fixture_admin
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: aip_test_admin
        ports:
          - '127.0.0.1:34392:3306'
        options: >-
          --health-cmd "mariadb-admin ping -h127.0.0.1 -uroot -pci_fixture_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify both engines, DDL races, DML-only grants and interrupted deployment recovery
        run: |
          cargo test -p aip-migrate --features mysql --test mysql_fence_verification --locked -- --test-threads=1
          cargo test -p aip-migrate --features mysql --test mysql_fence_verification --locked -- --ignored --nocapture --test-threads=1
          cargo test -p aip-migrate --features mysql --test mysql_drift_matrix --locked -- --ignored --nocapture --test-threads=1
          cargo test -p aip-migrate --features mysql --test mysql_capability_gate --locked -- --ignored --nocapture --test-threads=1
      - name: Verify MySQL durable job leases, concurrent claims and transactional outbox
        run: >-
          AIP_TEST_JOBS_URL="$AIP_TEST_MYSQL_URL"
          cargo test -p aip-migrate --features mysql --test mysql_jobs --locked
          -- --ignored --nocapture --test-threads=1
      - name: Verify MariaDB durable job leases, concurrent claims and transactional outbox
        run: >-
          AIP_TEST_JOBS_URL="$AIP_TEST_MARIADB_URL"
          cargo test -p aip-migrate --features mysql --test mysql_jobs --locked
          -- --ignored --nocapture --test-threads=1
      - name: Verify MySQL login sessions rotate single-use refresh tokens and revoke on replay
        run: >-
          AIP_TEST_JOBS_URL="$AIP_TEST_MYSQL_URL"
          cargo test -p aip-migrate --features mysql --test mysql_auth_sessions --locked
          -- --ignored --nocapture --test-threads=1
      - name: Verify MariaDB login sessions rotate single-use refresh tokens and revoke on replay
        run: >-
          AIP_TEST_JOBS_URL="$AIP_TEST_MARIADB_URL"
          cargo test -p aip-migrate --features mysql --test mysql_auth_sessions --locked
          -- --ignored --nocapture --test-threads=1
      - name: Verify MySQL policy reads, scalar types and atomic writes over HTTP
        run: >-
          cargo test -p aip-service --features mysql --test mysql_read_http --test mysql_write_http --locked
          -- --include-ignored --nocapture --test-threads=1
      - name: Verify actual MySQL adoption, principal binding and served JWT requests
        run: >-
          cargo test -p aip-cli --features mysql --test mysql_adoption_flow --locked
          -- --ignored --nocapture --test-threads=1
      - name: Verify MySQL HTTP job ownership and transactional effect replay
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::tests::mysql_job_http_and_effect_journal_preserve_owner_lease_and_transaction_boundaries
          -- --ignored --exact --nocapture
      # The service keeps one process-wide schema, so this live test runs in its own process.
      - name: Verify MySQL triggers run as the service principal and converge on server-minted keys
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::tests::mysql_triggers_run_as_the_service_principal_and_converge_on_server_minted_keys
          -- --ignored --exact --nocapture
      - name: Verify MySQL job HTTP effects are journaled and an unknown outcome is never repeated
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::tests::mysql_http_effects_are_journaled_and_an_unknown_outcome_is_never_repeated
          -- --ignored --exact --nocapture
      - name: Verify MySQL job Redis and Mongo writes are journaled and only repeatable unknowns are sent again
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::tests::mysql_external_writes_are_journaled_and_only_repeatable_unknowns_are_sent_again
          -- --ignored --exact --nocapture
      - name: Verify MySQL job event streams publish once, replay in order and expire explicitly
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::mysql_job_stores_tests::mysql_event_streams_publish_once_replay_in_order_and_expire_explicitly
          -- --ignored --exact --nocapture
      - name: Verify MySQL job message queues publish from jobs and serve the client routes
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::mysql_job_stores_tests::mysql_message_queues_publish_from_jobs_and_serve_the_client_routes
          -- --ignored --exact --nocapture
      - name: Verify MySQL message handlers turn messages into jobs and ack with the acceptance
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::mysql_job_stores_tests::mysql_message_handlers_turn_messages_into_jobs_and_ack_with_the_acceptance
          -- --ignored --exact --nocapture
      - name: Verify MySQL managed files are put and read by jobs and clients under quota
        run: >-
          cargo test -p aip-service --features mysql --lib --locked
          mysql_jobs::mysql_job_stores_tests::mysql_managed_files_are_put_and_read_by_jobs_and_clients_under_quota
          -- --ignored --exact --nocapture
