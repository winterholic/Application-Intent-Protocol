name: App packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install toolchains
        run: |
          rustup update stable
          rustup default stable
          npm ci --prefix spikes/spike-0-ts --ignore-scripts --no-audit --no-fund
      - name: Verify app packaging boundaries
        run: node --test product/tests/app-package.test.mjs product/tests/app-manifest.test.mjs product/tests/package-boundaries.test.mjs product/tests/app-deploy.test.mjs
      - name: Verify relocated release packages and installed SDK consumers
        run: node --test product/tests/app-package-e2e.test.mjs
      - name: Verify native deployment lifecycle and schema migration on an owned PostgreSQL
        run: node --test product/tests/app-deploy-live.test.mjs
