name: Dependencies

on:
  # NOTE: release-candidate.yml calls this workflow on release branches and v* tags, where path filters would otherwise skip it.
  workflow_call:
  # NOTE: main pushes run unfiltered. A `paths:` filter skipped this required workflow for commits it did not list (stabilization F-03).
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'spikes/spike-0-ts/package*.json'
      - 'porting/flaskbb/ui/requirements.txt'
  schedule:
    # New advisories appear without any change here, so check the locked versions every Monday.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install cargo-audit and cargo-deny
        run: |
          rustup update stable
          rustup default stable
          cargo install cargo-audit cargo-deny --locked
          python3 -m pip install --user pip-audit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: cargo audit, cargo deny, npm audit and pip-audit for every lock file
        run: bash tools/dependency-check.sh
