name: Dependencies

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'spikes/spike-0-ts/package*.json'
      - 'tools/dependency-check.sh'
      - '.github/workflows/dependencies.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'spikes/spike-0-ts/package*.json'
  schedule:
    # New advisories appear without any change here, so check the locked versions every Monday.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install cargo-audit and cargo-deny
        run: |
          rustup update stable
          rustup default stable
          cargo install cargo-audit cargo-deny --locked
      - name: cargo audit, cargo deny and npm audit for every lock file
        run: bash tools/dependency-check.sh
