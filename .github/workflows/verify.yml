name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      member_ui_diagnostic:
        description: Run the pinned FaceReview UI/DB journeys without the broad Rust gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
      # Disposable native-stores fixture credentials; no service secrets are used.
      AIP_TEST_MONGO_URL: mongodb://aip_test_slice13a:local_fixture_only_13a@127.0.0.1:15441/aip_test_slice13a?authSource=admin
      # Isolated mongod used only by the UUID ownership integration tests.
      AIP_TEST_MONGO_UUID_URL: mongodb://127.0.0.1:25443/aip_test_uuid_ci
      AIP_TEST_REDIS_URL: redis://:local_fixture_only_13a@127.0.0.1:15442/
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          # The engine tests use passwordless connections to this disposable local fixture.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize safe verification locator
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/aip-facereview-browser"
          export AIP_VERIFY_FAILURE_FILE="$RUNNER_TEMP/aip-facereview-browser/verify-failure.txt"
          echo "AIP_VERIFY_FAILURE_FILE=$AIP_VERIFY_FAILURE_FILE" >> "$GITHUB_ENV"
          source scripts/verify-safe-locator.sh
          aip_verify_stage "setup Node 26"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install verification tools
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "install verification tools"
          sudo apt-get update
          sudo apt-get install -y postgresql-client bubblewrap apparmor python3-venv
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          npm ci --prefix spikes/spike-0-ts --ignore-scripts --no-audit --no-fund
          python3 --version
          python3 -m venv "$RUNNER_TEMP/aip-python-checks"
          "$RUNNER_TEMP/aip-python-checks/bin/pip" install --no-cache-dir mypy==2.4.0 setuptools wheel
          echo "$RUNNER_TEMP/aip-python-checks/bin" >> "$GITHUB_PATH"
      - name: Configure CI Bubblewrap user namespace policy
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "configure CI Bubblewrap user namespace policy"
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) == 1 ]]; then
            # A separate attachment avoids overriding distribution or third-party bwrap profiles.
            sandbox_bin="$RUNNER_TEMP/aip-ci-bwrap"
            mkdir -p "$sandbox_bin"
            cp "$(command -v bwrap)" "$sandbox_bin/bwrap"
            sudo tee /etc/apparmor.d/aip-ci-bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile aip-ci-bwrap "$sandbox_bin/bwrap" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/aip-ci-bwrap
            echo "$sandbox_bin" >> "$GITHUB_PATH"
          fi
      - name: Verify Linux worker isolation boundaries
        if: ${{ !inputs.member_ui_diagnostic }}
        run: AIP_TEST_BWRAP=1 cargo test --manifest-path spikes/spike-v4-worker/Cargo.toml --lib isolation::tests --locked --target-dir target
      - name: Verify worker teardown leaves no descendant processes
        if: ${{ !inputs.member_ui_diagnostic }}
        run: AIP_TEST_BWRAP=1 cargo test --manifest-path spikes/spike-v4-worker/Cargo.toml --lib cleanup_tests --locked --target-dir target
      - name: Start native driver fixtures
        if: ${{ !inputs.member_ui_diagnostic }}
        id: native-fixtures
        run: docker compose --project-name aip-ci-native -f spikes/spike-v4-worker/tests/fixtures/native-stores/compose.yaml up --wait --wait-timeout 120 mongo mongo-uuid redis
      - name: Verify compiler, runtime, product, worker, transport and SDK
        if: ${{ !inputs.member_ui_diagnostic }}
        env:
          AIP_VERIFY_FAILURE_FILE: ${{ runner.temp }}/aip-facereview-browser/verify-failure.txt
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "broad compiler, runtime, product, worker, transport and SDK gate"
          bash tools/verify.sh
      - name: Build AIP CLI for the focused UI diagnostic
        if: ${{ inputs.member_ui_diagnostic }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "focused AIP CLI build"
          cargo build -p aip-cli --locked
      - name: Prepare the pinned FaceReview React browser journey
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "prepare pinned FaceReview React browser journey"
          ui="$RUNNER_TEMP/aip-facereview-ui"
          sdk="$RUNNER_TEMP/aip-facereview-sdk"
          definition="$RUNNER_TEMP/aip-facereview-member.aip"
          mkdir -p "$RUNNER_TEMP/aip-facereview-browser"
          cat product/tests/fixtures/facereview-mysql/facereview.aip > "$definition"
          printf '\n' >> "$definition"
          cat product/tests/fixtures/facereview-auth/operations.aip >> "$definition"
          echo "AIP_FACEREVIEW_DEFINITION_FILE=$definition" >> "$GITHUB_ENV"
          echo "AIP_FACEREVIEW_DEFINITION_SHA256=$(sha256sum "$definition" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          git clone --quiet --filter=blob:none --no-checkout --depth=1 \
            https://github.com/joowon-jang/facereview-front.git "$ui"
          git -C "$ui" fetch --quiet --depth=1 origin 2e7c021fa5abebd72278d841b8066a33d45cfbb3
          git -C "$ui" checkout --quiet --detach 2e7c021fa5abebd72278d841b8066a33d45cfbb3
          test "$(git -C "$ui" rev-parse HEAD)" = "2e7c021fa5abebd72278d841b8066a33d45cfbb3"
          node product/tools/build-sdk.mjs --out "$sdk"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" "$sdk"
          AIP_CLI_BIN="$GITHUB_WORKSPACE/target/debug/aip" porting/facereview/apply-ui-overlay.sh "$ui" "$definition"
          (cd "$ui" && node .yarn/releases/yarn-4.12.0.cjs add "@aip/sdk@file:$RUNNER_TEMP/aip-sdk-0.1.0.tgz")
          python3 -m venv "$RUNNER_TEMP/aip-browser"
          "$RUNNER_TEMP/aip-browser/bin/pip" install --no-cache-dir playwright==1.64.0
          "$RUNNER_TEMP/aip-browser/bin/python" -m playwright install --with-deps chromium
      - name: Prepare the pinned FaceReview admin console browser journey
        shell: bash
        run: |
          set -Eeuo pipefail
          source scripts/verify-safe-locator.sh
          aip_verify_stage "prepare pinned FaceReview admin console browser journey"
          set -euo pipefail
          admin="$RUNNER_TEMP/aip-facereview-admin-ui"
          pinned=ab0386c878a5ba5c7c079a262b987c10d211d22d
          git clone --quiet --filter=blob:none --no-checkout --depth=1 \
            https://github.com/winterholic/new-facereview-admin-front.git "$admin"
          git -C "$admin" fetch --quiet --depth=1 origin "$pinned"
          git -C "$admin" checkout --quiet --detach "$pinned"
          test "$(git -C "$admin" rev-parse HEAD)" = "$pinned"
          AIP_CLI_BIN="$GITHUB_WORKSPACE/target/debug/aip" porting/facereview/apply-admin-ui-overlay.sh "$admin" "$AIP_FACEREVIEW_DEFINITION_FILE"
          cd "$admin"
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/aip-sdk-0.1.0.tgz"
          # The pinned admin UI's own build (tsc -b && vite build) against the generated binding and the installed SDK.
          npx tsc -b
          VITE_AIP_URL=http://127.0.0.1:1 npx vite build
      - name: Verify real HTTP to Node and Python workers to MySQL
        env:
          AIP_E2E_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
          AIP_E2E_MYSQL_PORT: '55441'
          AIP_FACEREVIEW_UI_DIR: ${{ runner.temp }}/aip-facereview-ui
          AIP_FACEREVIEW_ADMIN_UI_DIR: ${{ runner.temp }}/aip-facereview-admin-ui
          AIP_FACEREVIEW_PYTHON: ${{ runner.temp }}/aip-browser/bin/python
          AIP_FACEREVIEW_BROWSER_OUTPUT: ${{ runner.temp }}/aip-facereview-browser
          AIP_E2E_FAILURE_FILE: ${{ runner.temp }}/aip-facereview-browser/verify-failure.txt
        shell: bash
        run: |
          if [[ "${{ inputs.member_ui_diagnostic }}" == "true" ]]; then
            bash scripts/verify-mysql-worker-e2e.sh run-ci-member
          else
            bash scripts/verify-mysql-worker-e2e.sh run-ci
          fi
      - name: Preserve FaceReview browser screenshots and safe network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: facereview-ui-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aip-facereview-browser
          if-no-files-found: warn
          retention-days: 7
      - name: Show native fixture logs on failure
        if: failure() && steps.native-fixtures.outcome != '' && steps.native-fixtures.outcome != 'skipped'
        run: docker compose --project-name aip-ci-native -f spikes/spike-v4-worker/tests/fixtures/native-stores/compose.yaml logs --no-color mongo mongo-uuid redis
      - name: Stop native driver fixtures
        if: always() && steps.native-fixtures.outcome != '' && steps.native-fixtures.outcome != 'skipped'
        run: docker compose --project-name aip-ci-native -f spikes/spike-v4-worker/tests/fixtures/native-stores/compose.yaml down --volumes
