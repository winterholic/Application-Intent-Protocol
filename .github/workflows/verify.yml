name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          # The engine tests use passwordless connections to this disposable local fixture.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          npm ci --prefix spikes/spike-0-ts --ignore-scripts --no-audit --no-fund
      - name: Verify compiler, runtime, product and SDK
        run: bash tools/verify.sh
