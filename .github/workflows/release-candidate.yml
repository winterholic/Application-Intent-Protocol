name: Release candidate

# Runs every required workflow on one SHA, ignoring path filters. Path-filtered push workflows skip commits that
# touch only unlisted paths (a0fa2729, 723fb474) and a merge can start no runs at all (d327b264), so a 1.0 tag must
# not rely on them. Tag only after the `required` job below is green for the exact tagged SHA.
# This workflow never publishes: it has no tag, release, npm or PyPI step, and product/tests/test_release_candidate_required.py pins that.
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release-gate:
    uses: ./.github/workflows/aip-release-gate.yml
  database-contracts:
    uses: ./.github/workflows/database-contracts.yml
  worker-jobs-linux:
    uses: ./.github/workflows/worker-jobs-linux.yml
  cgroup:
    uses: ./.github/workflows/cgroup.yml
  flaskbb-parity:
    uses: ./.github/workflows/flaskbb-parity.yml
  flaskbb-post-order:
    uses: ./.github/workflows/flaskbb-post-order.yml
  deploy-checks:
    uses: ./.github/workflows/deploy-checks.yml
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  app-packages:
    uses: ./.github/workflows/app-packages.yml
  brokers:
    uses: ./.github/workflows/brokers.yml
  object-storage:
    uses: ./.github/workflows/object-storage.yml
  sdk-semantic-e2e:
    uses: ./.github/workflows/sdk-semantic-e2e.yml
  semantic-conformance:
    uses: ./.github/workflows/semantic-conformance.yml
  macos-platform-tests:
    uses: ./.github/workflows/macos-platform-tests.yml
  # Independent consumer apps on this exact SHA (core_sha defaults to the caller's github.sha), not a pinned past commit.
  independent-consumers:
    uses: ./.github/workflows/independent-consumer-rc.yml
  concurrency-contracts:
    uses: ./.github/workflows/concurrency-contracts.yml

  required:
    name: required (all workflows green on this SHA)
    if: ${{ always() }}
    needs:
      - verify
      - release-gate
      - database-contracts
      - worker-jobs-linux
      - cgroup
      - flaskbb-parity
      - flaskbb-post-order
      - deploy-checks
      - dependencies
      - app-packages
      - brokers
      - object-storage
      - sdk-semantic-e2e
      - semantic-conformance
      - macos-platform-tests
      - independent-consumers
      - concurrency-contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lists this run's jobs so a job that skipped inside a green workflow, or ran for another commit, cannot pass.
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Only `success` counts: a skipped or cancelled workflow, or a job that skipped inside a green one, is not a pass.
      # The decision is scripts/release-candidate-required.py so product/tests/test_release_candidate_required.py can test it.
      - name: Require every workflow and job to succeed on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]' > "$RUNNER_TEMP/jobs.jsonl"
          python3 scripts/release-candidate-required.py \
            --sha "$GITHUB_SHA" \
            --needs "$RUNNER_TEMP/needs.json" \
            --workflow .github/workflows/release-candidate.yml \
            --jobs "$RUNNER_TEMP/jobs.jsonl" \
            --allow-skipped 'worker-jobs-linux / crypto-compile-repair'
