name: Service semantic conformance

on:
  # NOTE: release-candidate.yml calls this workflow on release branches and v* tags, where path filters would otherwise skip it.
  workflow_call:
  # NOTE: main pushes run unfiltered. A `paths:` filter skipped this required workflow for commits it did not list (stabilization F-03).
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/aip-cli/**'
      - 'crates/aip-sema/**'
      - 'crates/aip-runtime/**'
      - 'crates/aip-test-support/**'
      - 'conformance/**'
      - '.github/workflows/semantic-conformance.yml'

permissions:
  contents: read

concurrency:
  group: semantic-conformance-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable components
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - name: Validate isolated PostgreSQL target
        run: node --input-type=module -e 'import { requireTestDatabase } from "./product/test-support/postgres-guard.mjs"; const target = requireTestDatabase(); console.log(`${target.host}:${target.port}/${target.dbname}`)'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p aip-cli --test service_flow --locked -- -D warnings
      - name: Run Core shared semantic fixture
        run: cargo test -p aip-sema --test shared_semantic_fixture --locked -- --nocapture
      - name: Run Core runtime semantic fixture on PostgreSQL
        run: cargo test -p aip-cli --features poc-runtime --test core_semantic_fixture --locked -- --nocapture
      - name: Run focused service policy regressions
        run: cargo test -p aip-cli --test service_flow --locked service_policy_ -- --nocapture
      - name: Run service HTTP and PostgreSQL contract tests
        run: cargo test -p aip-cli --test service_flow --locked -- --nocapture
