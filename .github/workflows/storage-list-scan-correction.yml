name: Storage list-scan correction evidence

on:
  push:
    branches: [rescue/ops-20261106]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-list-scan-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pg-minio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
      AIP_STORAGE_EVIDENCE_DIR: ${{ runner.temp }}/storage-list-scan-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build pinned TLS MinIO tools
        run: |
          go install github.com/minio/minio@RELEASE.2025-09-06T17-38-46Z
          go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run independent storage checks and collect evidence
        shell: bash
        run: |
          mkdir -p "$AIP_STORAGE_EVIDENCE_DIR"
          set +e
          python3 scripts/run-storage-check.py --dir "$AIP_STORAGE_EVIDENCE_DIR" --label format -- rustfmt --edition 2021 --check spikes/spike-v6-transport/src/object_transport.rs spikes/spike-v6-transport/tests/object_ledger_s3.rs
          python3 scripts/run-storage-check.py --dir "$AIP_STORAGE_EVIDENCE_DIR" --label diff -- git diff --check
          python3 scripts/run-storage-check.py --dir "$AIP_STORAGE_EVIDENCE_DIR" --label pg-ledger -- cargo test -p aip-execution --test object_ledger --locked -- --nocapture
          python3 scripts/run-storage-check.py --dir "$AIP_STORAGE_EVIDENCE_DIR" --label pg-principal-seed -- cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --test object_ledger_s3 a_valid_principal_is_seeded_for_list_scan_before_any_ledger_row_exists --locked -- --nocapture
          python3 scripts/run-storage-check.py --dir "$AIP_STORAGE_EVIDENCE_DIR" --label tls-minio-list-scan -- scripts/test-minio-object-storage.sh
          python3 scripts/finish-storage-evidence.py "$AIP_STORAGE_EVIDENCE_DIR/results.json"
      - name: Upload exact command, stdout, stderr and result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-list-scan-correction-${{ github.sha }}
          path: ${{ runner.temp }}/storage-list-scan-evidence/
          if-no-files-found: error
          retention-days: 14
