name: Linux worker jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worker-jobs-linux.yml'
      - 'crates/**'
      - 'product/**'
      - 'porting/flaskbb/**'
      - 'spikes/spike-v1-fixture/**'
      - 'spikes/spike-v3-write/**'
      - 'spikes/spike-v4-worker/**'
      - 'spikes/spike-v6-transport/**'

permissions:
  contents: read

concurrency:
  group: worker-jobs-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIP_TEST_DATABASE_URL: host=127.0.0.1 port=5433 dbname=aip_test_ci user=runner
      AIP_TEST_ADMIN_URL: host=127.0.0.1 port=5433 dbname=postgres user=runner
      AIP_FLASKBB_TEST_MAILPIT_URL: http://127.0.0.1:55473
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: aip_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U runner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - '127.0.0.1:55473:8025'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - name: Install PostgreSQL client and Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client bubblewrap apparmor python3-venv
          rustup update stable
          rustup default stable
      - name: Configure scoped Bubblewrap user namespace profile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns) == 1 ]]; then
            sandbox_bin="$RUNNER_TEMP/aip-ci-bwrap"
            mkdir -p "$sandbox_bin"
            cp "$(command -v bwrap)" "$sandbox_bin/bwrap"
            sudo tee /etc/apparmor.d/aip-ci-bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile aip-ci-bwrap "$sandbox_bin/bwrap" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/aip-ci-bwrap
            echo "$sandbox_bin" >> "$GITHUB_PATH"
          fi
      - name: Install Node SDK test dependencies
        run: npm ci --prefix spikes/spike-0-ts --ignore-scripts --no-audit --no-fund
      - name: Build the product CLI
        run: cargo build -p aip-cli --locked
      - name: Validate encryption definitions and closed storage boundaries
        run: |
          cargo test --manifest-path spikes/spike-v1-fixture/Cargo.toml --locked --target-dir target --test encrypted_types --test diagnostics
          cargo test -p aip-migrate --locked --test encryption_gate --test encryption_activation_gate
          cargo test -p aip-execution --locked --test encryption_deks --test encryption_fence
      - name: Explain the seeded FlaskBB count query with and without JIT
        run: cargo test -p aip-migrate --locked --test flaskbb_read_plan -- --nocapture
      - name: Upgrade an actual pre-trace durable job schema with the product CLI
        env:
          AIP_TRACE_UPGRADE_DATABASE_URL: ${{ env.AIP_TEST_DATABASE_URL }}
          AIP_SERVICE_CLI: ${{ github.workspace }}/target/debug/aip
        run: >-
          cargo test -p aip-migrate --lib --locked
          trace_id_upgrade_tests::explicit_parent_job_schema_upgrade_adds_trace_id_and_rejects_drift
          -- --ignored --exact
      - name: Prove Linux worker sandbox boundaries with Bubblewrap
        run: AIP_TEST_BWRAP=1 cargo test --manifest-path spikes/spike-v4-worker/Cargo.toml --lib isolation::tests --locked --target-dir target
      - name: Run durable worker, retry, schedule, webhook and outbox jobs
        run: cargo test --manifest-path spikes/spike-v6-transport/Cargo.toml --locked --target-dir target --test job_retry --test job_breaker --test triggers --test outbox --test otlp --test encryption_gate --test bundle_http
      - name: Run installed product SDK smoke with Node and Python workers
        run: node --test product/tests/service-smoke.test.mjs
      - name: Verify isolated FlaskBB mail delivery and connect-stage recovery
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 5 "$AIP_FLASKBB_TEST_MAILPIT_URL/api/v1/info" >/dev/null
          node --test porting/flaskbb/tests/mail-fixture.test.mjs
          node --test porting/flaskbb/tests/mail-jobs.test.mjs
      - name: Verify FlaskBB fixture guard and mailbox uniqueness
        run: |
          node --test porting/flaskbb/tests/fixture-env.test.mjs porting/flaskbb/tests/conversations-security.test.mjs
          cargo test -p aip-migrate --locked --test foreign_shared_uniqueness
      - name: Verify FlaskBB topic ordering and UI requests
        run: |
          python3 -m venv "$RUNNER_TEMP/flaskbb-ui"
          "$RUNNER_TEMP/flaskbb-ui/bin/pip" install --no-cache-dir -r porting/flaskbb/ui/requirements.txt
          PYTHONPATH="$GITHUB_WORKSPACE/product/python" "$RUNNER_TEMP/flaskbb-ui/bin/python" -m unittest porting.flaskbb.tests.test_ui_host porting.flaskbb.tests.test_mail_jobs
          node --test porting/flaskbb/tests/sticky-order.test.mjs
      - name: Revalidate FlaskBB core, CLI and search consistency on main
        env:
          AIP_FLASKBB_TEST_PYTHON: ${{ runner.temp }}/flaskbb-ui/bin/python
        run: >-
          node --test --test-concurrency=1
          porting/flaskbb/tests/contract.test.mjs
          porting/flaskbb/tests/cli.test.mjs
          porting/flaskbb/tests/search.test.mjs
          porting/flaskbb/tests/ban.test.mjs
          porting/flaskbb/tests/moderation.test.mjs
          porting/flaskbb/tests/provisioning.test.mjs
          porting/flaskbb/tests/aip-read.test.mjs
          porting/flaskbb/tests/features.test.mjs
