<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FlaskBB forum">
    <title>{% block title %}FlaskBB{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pygments.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="flaskbb-layout"><div class="container">
    <header class="flaskbb-header">
        <div class="flaskbb-meta"><div class="flaskbb-title">FlaskBB</div><div class="flaskbb-subtitle">A lightweight forum software in Flask</div></div>
    </header>
    <nav class="navbar navbar-default" role="navigation"><div class="collapse navbar-collapse">
        <ul class="nav navbar-nav forum-nav">
            <li><a href="{{ url_for('forum_index') }}"><span class="fa fa-comment"></span> Forum</a></li>
        </ul>
        <ul class="nav navbar-nav navbar-right">
            {% if logout_url %}<li><span class="btn btn-primary navbar-btn">{{ user.username if user else 'Signed in' }}</span></li>
            <li><form method="post" action="{{ logout_url }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-default navbar-btn">Logout</button></form></li>
            {% else %}<li><a class="btn btn-primary navbar-btn" href="{{ url_for('login') }}"><span class="fa fa-user"></span> Login</a></li>{% endif %}
        </ul>
    </div></nav>
    <main>{% block content %}{% endblock %}</main>
</div>
<footer class="flaskbb-footer"><div class="container"><div class="text-muted">powered by <a href="https://flaskbb.org">FlaskBB</a> · © 2013 - FlaskBB Team</div></div></footer>
</div>
</body>
</html>
