{% extends "layout.html" %}
{% block title %}Settings - FlaskBB{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Account Settings</h1>
</div>

{% if saved %}
<div class="alert alert-success">Settings saved successfully!</div>
{% endif %}

<div class="panel panel-default">
    <div class="panel-body">
        <form method="post" action="{{ url_for('user_settings') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" class="form-control" value="{{ current_user.location or '' }}" maxlength="100">
            </div>
            <div class="form-group">
                <label for="website">Website</label>
                <input type="url" id="website" name="website" class="form-control" value="{{ current_user.website or '' }}">
            </div>
            <div class="form-group">
                <label for="avatar">Avatar URL</label>
                <input type="url" id="avatar" name="avatar" class="form-control" value="{{ current_user.avatar or '' }}">
            </div>
            <div class="form-group">
                <label for="signature">Signature</label>
                <textarea id="signature" name="signature" class="form-control" rows="3">{{ current_user.signature or '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="theme">Theme</label>
                <input type="text" id="theme" name="theme" class="form-control" value="{{ current_user.theme or '' }}" maxlength="15">
            </div>
            <div class="form-group">
                <label for="language">Language</label>
                <input type="text" id="language" name="language" class="form-control" value="{{ current_user.language or '' }}" maxlength="15">
            </div>
            <button type="submit" class="btn btn-primary"><span class="fa fa-save"></span> Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
